# Spike config: the Chrome variant. Run from this directory with `bun test`.
# bunfig.firefox.toml is the same file with the Firefox values.

# The globals WXT defines at build time (wxt/dist/core/utils/globals.mjs).
# Without these, Bun reads import.meta.env as process.env, so every one of
# them is undefined (or a string, if set in the environment).
[define]
"import.meta.env.BROWSER" = "'chrome'"
"import.meta.env.CHROME" = "true"
"import.meta.env.FIREFOX" = "false"
"import.meta.env.SAFARI" = "false"
"import.meta.env.EDGE" = "false"
"import.meta.env.OPERA" = "false"
"import.meta.env.MANIFEST_VERSION" = "3"

[test]
preload = ["./setup/happydom.ts", "./setup/wxt.ts", "./setup/testing-library.ts"]
# isolation/, parity/ and probes/ need their own flags or preloads; see run.sh.
pathIgnorePatterns = ["isolation/**", "parity/**", "probes/**"]
coverageReporter = ["text", "lcov"]
