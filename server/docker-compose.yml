# Dokploy: service type Compose, mode Docker Compose (not Stack).
# Add the domain in Dokploy with port 3847; don't write Traefik labels by hand.
services:
  token-broker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped

    # Dokploy's .env is only used for interpolation, so values are mapped here.
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EXTENSION_IDS: ${ALLOWED_EXTENSION_IDS:-}
      PORT: "3847"

    # No `ports:`; Traefik reaches it over dokploy-network.
    expose:
      - "3847"

    networks:
      - dokploy-network

    # The image has no curl or wget.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3847/health'); if (!r.ok) process.exit(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true
