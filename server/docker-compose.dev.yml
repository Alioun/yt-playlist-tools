# Local development only. From the repo root:
#   docker compose -f server/docker-compose.dev.yml up --build --watch
# Reads server/.env.
services:
  token-broker:
    build:
      context: ..
      dockerfile: server/Dockerfile

    # Loopback only: the container holds your client secret.
    ports:
      - "127.0.0.1:3847:3847"

    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EXTENSION_IDS: ${ALLOWED_EXTENSION_IDS:-}
      PORT: "3847"

    volumes:
      - ./:/app/server:ro

    # bun --watch reloads on Linux hosts. On Docker Desktop file events don't
    # cross the mount, so develop.watch restarts the container instead.
    entrypoint: ["bun", "--watch", "run", "server/index.ts"]
    stop_grace_period: 1s

    develop:
      watch:
        - path: ./
          action: restart
          ignore:
            - .env
            - "*.test.ts"

    # Same check as production, polled faster.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3847/health'); if (!r.ok) process.exit(1)"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
