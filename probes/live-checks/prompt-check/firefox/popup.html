<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 10px; }
      button { font: inherit; margin: 4px 0; }
      pre { white-space: pre-wrap; background: #eee; padding: 4px; }
    </style>
  </head>
  <body>
    <b>ytpt prompt check (Firefox)</b>
    <p>1. Copy the lines on this add-on's “Permissions” tab in about:addons.</p>
    <p>2. If youtube.com access shows as off there, press the button and copy the prompt Firefox shows.</p>
    <button id="request">Request youtube.com access</button>
    <pre id="state"></pre>
    <script src="popup.js"></script>
  </body>
</html>
